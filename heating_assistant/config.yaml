name: "HeatingAssistant"
version: "2026.08.11"
slug: heatingassistant
description: "Heating control App for Home Assistant OS"
url: "https://github.com/marcuskrogh/HeatingAssistant"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
timeout: 120
watchdog: "http://[HOST]:[PORT:8100]/"
ingress: true
ingress_port: 8100
panel_icon: mdi:radiator
panel_title: HeatingAssistant
# hassio_api injects SUPERVISOR_TOKEN so the App can call Supervisor APIs
# (MQTT service discovery and Core restart after Settings Restart required).
# mqtt:need provisions Mosquitto credentials for this App. Without both,
# discovery is skipped and Mosquitto returns CONNACK rc=5 (not authorised).
hassio_api: true
hassio_role: default
# homeassistant_api is for HA REST from the App, not the Supervisor restart path.
homeassistant_api: true
services:
  - mqtt:need
ports:
  8100/tcp: 8100
map:
  - type: data
    read_only: false
  - type: homeassistant_config
    read_only: false
options:
  instance_id: default
  mqtt_broker: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  instance_id: str
  mqtt_broker: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
