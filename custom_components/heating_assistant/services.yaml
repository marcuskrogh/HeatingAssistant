reload:
  name: Reload Heating Assistant
  description: >
    Re-read configuration.yaml and reload all Heating Assistant config entries
    without restarting Home Assistant. The rolling observation history and
    per-room overrides (manual on/off, schedule suspend) are preserved across
    the reload. If the YAML fails validation the previous configuration keeps
    running.

simulate_thermal_response:
  name: Simulate thermal response
  description: >
    Run a standalone thermal simulation showing how a room responds to constant
    heating power over a specified duration.  Useful during setup to verify that
    configured thermal parameters and heater power are realistic.  The result is
    returned as a persistent notification containing the predicted temperature
    trajectory, time constant, and steady-state temperature.
  fields:
    room_name:
      name: Room name
      description: Name of the room to simulate (must match a configured room name).
      required: true
      example: "living_room"
      selector:
        text:
    initial_temp:
      name: Initial temperature
      description: Starting temperature of the room [°C].
      required: true
      default: 15.0
      example: 15.0
      selector:
        number:
          min: -10
          max: 40
          step: 0.5
          unit_of_measurement: "°C"
    outdoor_temp:
      name: Outdoor temperature
      description: Outdoor temperature held constant during the simulation [°C].
      required: true
      default: 0.0
      example: 0.0
      selector:
        number:
          min: -30
          max: 40
          step: 0.5
          unit_of_measurement: "°C"
    heating_power:
      name: Heating power
      description: Constant thermal power applied to the room [W].
      required: true
      default: 2000
      example: 2000
      selector:
        number:
          min: 0
          max: 20000
          step: 100
          unit_of_measurement: "W"
    duration_hours:
      name: Duration
      description: Length of the simulation [hours].
      required: true
      default: 8.0
      example: 8.0
      selector:
        number:
          min: 1
          max: 48
          step: 1
          unit_of_measurement: "h"

estimate_parameters:
  name: Estimate thermal parameters
  description: >
    Back-calculate thermal_mass and r_external from an observed heating
    experiment.  Heat a room with known power for a known time and record the
    start and end temperatures.  The service returns estimated values as a
    persistent notification.
  fields:
    room_name:
      name: Room name
      description: Name of the room (must match a configured room name).
      required: true
      example: "living_room"
      selector:
        text:
    heating_power:
      name: Heating power
      description: Constant thermal power applied during the experiment [W].
      required: true
      example: 2000
      selector:
        number:
          min: 0
          max: 20000
          step: 100
          unit_of_measurement: "W"
    outdoor_temp:
      name: Outdoor temperature
      description: Outdoor temperature during the experiment [°C].
      required: true
      example: 5.0
      selector:
        number:
          min: -30
          max: 40
          step: 0.5
          unit_of_measurement: "°C"
    initial_temp:
      name: Initial temperature
      description: Room temperature at the start of the experiment [°C].
      required: true
      example: 15.0
      selector:
        number:
          min: -10
          max: 40
          step: 0.1
          unit_of_measurement: "°C"
    final_temp:
      name: Final temperature
      description: Room temperature at the end of the experiment [°C].
      required: true
      example: 20.0
      selector:
        number:
          min: -10
          max: 40
          step: 0.1
          unit_of_measurement: "°C"
    duration_seconds:
      name: Duration
      description: Duration of the experiment [seconds].
      required: true
      example: 7200
      selector:
        number:
          min: 60
          max: 172800
          step: 60
          unit_of_measurement: "s"

estimate_parameters_ml:
  name: Estimate thermal parameters (ML)
  description: >
    Estimate thermal_mass and r_external for all rooms using maximum-likelihood
    optimisation of the Kalman-filter prediction-error decomposition
    log-likelihood.  The estimation uses the rolling observation history that
    HeatingAssistant accumulates automatically during normal operation (at least
    30 steps, ~30 minutes, of data are required).  The result is reported as a
    persistent notification.  By default the estimated parameters are applied
    immediately to the live model so future MPC runs benefit from them;
    set apply_parameters to false for a dry run that only reports the estimates.
  fields:
    apply_parameters:
      name: Apply parameters
      description: >
        When true (default) the estimated values are applied to the running
        model.  When false the service only reports the estimates without
        changing anything (dry run).
      required: false
      default: true
      selector:
        boolean:

analyze_model_fit:
  name: Analyze model fit
  description: >
    Perform comprehensive analysis of model fit quality for all rooms.
    Computes goodness-of-fit metrics (RMSE, MAE, R²), residual statistics,
    and autocorrelation analysis from the accumulated history buffer.
    Results are reported as a persistent notification with detailed metrics
    for each room, helping identify when model parameters need adjustment.
  fields:
    room_name:
      name: Room name
      description: >
        Optional room name to analyze. If not specified, analyzes all rooms.
      required: false
      example: "living_room"
      selector:
        text:

validate_parameters:
  name: Validate thermal parameters
  description: >
    Validate the physical reasonableness of current thermal parameters
    (thermal_mass, r_external) for all rooms. Checks if parameters are
    within expected ranges and computes thermal time constants.
    Warns about potentially invalid or extreme parameter values that
    may indicate estimation problems or configuration errors.
  fields:
    room_name:
      name: Room name
      description: >
        Optional room name to validate. If not specified, validates all rooms.
      required: false
      example: "living_room"
      selector:
        text:

controller_performance_report:
  name: Controller performance report
  description: >
    Generate a detailed report on MPC controller performance for setpoint
    tracking. Analyzes tracking errors, overshoot/undershoot, time spent
    above/below setpoint, and overall control quality. Helps identify
    whether controller tuning parameters (energy_weight, smoothing_weight,
    constraint_offset) need adjustment.
  fields:
    room_name:
      name: Room name
      description: >
        Optional room name to analyze. If not specified, analyzes all rooms.
      required: false
      example: "living_room"
      selector:
        text:

set_schedule_enabled:
  name: Suspend or resume comfort schedule
  description: >
    Suspend or resume the comfort schedule (the time-of-day setback /
    sleep periods configured under each room's ``schedule`` block).
    Suspending a schedule restores the room's base setpoint and stops
    enforcing any "off" periods, which is useful for one-off exceptions
    such as staying up late or working from home.  When the room name is
    omitted the change applies to every configured room.  The schedule
    state is in-memory only and resets to enabled on restart.
  fields:
    room_name:
      name: Room name
      description: >
        Optional room name to target.  When omitted the change applies to
        every configured room.
      required: false
      example: "living_room"
      selector:
        text:
    enabled:
      name: Enabled
      description: >
        ``true`` resumes the schedule (default at startup), ``false``
        suspends it until re-enabled.
      required: true
      default: false
      selector:
        boolean:

run_open_loop_simulation:
  name: Run open-loop simulation diagnostic
  description: >
    Evaluate model quality by running a multi-step open-loop (free-run)
    simulation over the recorded history buffer and comparing it against the
    observed temperatures.  Unlike the one-step-ahead Kalman predictions that
    are reported by the PredictionErrorSensor, this test does not correct the
    model state at each step — errors therefore accumulate, exposing any
    systematic model drift.

    Results are exposed on the OpenLoopRMSESensor for each room and reported
    as a persistent notification.  Use this service after parameter estimation
    to verify that the updated model genuinely predicts temperature evolution
    rather than merely fitting a one-step-ahead filter.

    Rule of thumb: open-loop RMSE < 0.2 °C over 30 steps (30 min) is
    excellent; > 0.5 °C indicates that the model should be re-estimated.
  fields:
    room_name:
      name: Room name
      description: >
        Optional room name to run the simulation for.  If not specified,
        simulates all rooms.
      required: false
      example: "living_room"
      selector:
        text:
    segment_length:
      name: Segment length (steps)
      description: >
        Number of history-buffer steps per open-loop simulation segment.
        Each step is one UPDATE_INTERVAL (60 s), so the default of 30 steps
        corresponds to a 30-minute free-run window.
      required: false
      default: 30
      example: 30
      selector:
        number:
          min: 5
          max: 120
          step: 5
          unit_of_measurement: "steps"

compute_loglik_slice:
  name: Compute log-likelihood slice
  description: >
    Evaluate the CD-EKF PED log-likelihood on a 2-D grid in
    (log thermal_mass, log r_external) space, centred on the room's
    current MLE values.  Used by the Diagnostics dashboard to render a
    contour plot of the likelihood landscape so the user can assess
    parameter identifiability and the curvature of the optimum.  The
    computation runs CD-EKF over the full history buffer for every grid
    point and may take several seconds for an 11x11 grid.
  fields:
    room_name:
      name: Room name
      description: Room whose parameters should be sliced (must match a configured room).
      required: true
      example: "living_room"
      selector:
        text:
    n_grid:
      name: Grid points per axis
      description: Number of grid points per axis (odd values keep the centre on a grid line).
      required: false
      default: 11
      example: 11
      selector:
        number:
          min: 3
          max: 41
          step: 2
    span_log:
      name: Half-width (log-units)
      description: Half-width of the slice in log-units (1.0 ≈ factor 2.7 either side).
      required: false
      default: 1.0
      example: 1.0
      selector:
        number:
          min: 0.1
          max: 4.0
          step: 0.1

regenerate_dashboard:
  name: Regenerate Lovelace dashboard
  description: >
    Rebuild the per-room Heating Assistant Lovelace dashboard from the
    current room and heat-source configuration.  The generated YAML is
    returned in the service response and (unless ``dry_run`` is set) also
    written to ``<config>/dashboards/heating_assistant.yaml`` so it can be
    referenced from ``configuration.yaml`` via ``lovelace.dashboards`` or
    pasted into a new dashboard in the UI.
  fields:
    dry_run:
      name: Dry run
      description: >
        When enabled, the YAML is returned in the response but no file is
        written and no notification is created.  Useful for previewing the
        dashboard before installing it.
      required: false
      default: false
      example: false
      selector:
        boolean:
    filename:
      name: Output filename
      description: >
        Optional plain filename (no directory components) for the generated
        YAML inside ``<config>/dashboards``.  Defaults to
        ``heating_assistant.yaml``.
      required: false
      example: "heating_assistant.yaml"
      selector:
        text:
