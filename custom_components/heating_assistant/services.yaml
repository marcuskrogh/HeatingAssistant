reload:
  name: Reload Heating Assistant
  description: >
    Re-read configuration.yaml and reload all Heating Assistant config entries
    without restarting Home Assistant. The rolling observation history and
    per-room overrides (manual on/off, schedule suspend) are preserved across
    the reload. If the YAML fails validation the previous configuration keeps
    running.

simulate_thermal_response:
  name: Simulate thermal response
  description: >
    Run a standalone thermal simulation showing how a room responds to constant
    heating power over a specified duration.  Useful during setup to verify that
    configured thermal parameters and heater power are realistic.  The result is
    returned in the service response (visible in Developer Tools → Actions) and
    contains the predicted temperature trajectory, time constant, and
    steady-state temperature.
  fields:
    room_name:
      name: Room name
      description: Name of the room to simulate (must match a configured room name).
      required: true
      example: "living_room"
      selector:
        text:
    initial_temp:
      name: Initial temperature
      description: Starting temperature of the room [°C].
      required: true
      default: 15.0
      example: 15.0
      selector:
        number:
          min: -10
          max: 40
          step: 0.5
          unit_of_measurement: "°C"
    outdoor_temp:
      name: Outdoor temperature
      description: Outdoor temperature held constant during the simulation [°C].
      required: true
      default: 0.0
      example: 0.0
      selector:
        number:
          min: -30
          max: 40
          step: 0.5
          unit_of_measurement: "°C"
    heating_power:
      name: Heating power
      description: Constant thermal power applied to the room [W].
      required: true
      default: 2000
      example: 2000
      selector:
        number:
          min: 0
          max: 20000
          step: 100
          unit_of_measurement: "W"
    duration_hours:
      name: Duration
      description: Length of the simulation [hours].
      required: true
      default: 8.0
      example: 8.0
      selector:
        number:
          min: 1
          max: 48
          step: 1
          unit_of_measurement: "h"

estimate_parameters:
  name: Estimate thermal parameters
  description: >
    Back-calculate thermal_mass and r_external from an observed heating
    experiment.  Heat a room with known power for a known time and record the
    start and end temperatures.  The service returns the estimated values in
    the service response (visible in Developer Tools → Actions).
  fields:
    room_name:
      name: Room name
      description: Name of the room (must match a configured room name).
      required: true
      example: "living_room"
      selector:
        text:
    heating_power:
      name: Heating power
      description: Constant thermal power applied during the experiment [W].
      required: true
      example: 2000
      selector:
        number:
          min: 0
          max: 20000
          step: 100
          unit_of_measurement: "W"
    outdoor_temp:
      name: Outdoor temperature
      description: Outdoor temperature during the experiment [°C].
      required: true
      example: 5.0
      selector:
        number:
          min: -30
          max: 40
          step: 0.5
          unit_of_measurement: "°C"
    initial_temp:
      name: Initial temperature
      description: Room temperature at the start of the experiment [°C].
      required: true
      example: 15.0
      selector:
        number:
          min: -10
          max: 40
          step: 0.1
          unit_of_measurement: "°C"
    final_temp:
      name: Final temperature
      description: Room temperature at the end of the experiment [°C].
      required: true
      example: 20.0
      selector:
        number:
          min: -10
          max: 40
          step: 0.1
          unit_of_measurement: "°C"
    duration_seconds:
      name: Duration
      description: Duration of the experiment [seconds].
      required: true
      example: 7200
      selector:
        number:
          min: 60
          max: 172800
          step: 60
          unit_of_measurement: "s"

estimate_parameters_ml:
  name: Estimate thermal parameters (ML)
  description: >
    Estimate thermal_mass and r_external for all rooms using maximum-likelihood
    optimisation of the Kalman-filter prediction-error decomposition
    log-likelihood.  The estimation uses the rolling observation history that
    HeatingAssistant accumulates automatically during normal operation (at least
    30 steps, ~30 minutes, of data are required).  The estimates are surfaced
    through the per-room parameter / diagnostic sensors and fired on the
    ``heating_assistant_ml_estimation_result`` event.  By default the estimated
    parameters are NOT applied to the live model; set apply_parameters to true
    to apply them immediately.
  fields:
    apply_parameters:
      name: Apply parameters
      description: >
        When true the estimated values are applied to the running model.
        When false (default) the service only reports the estimates without
        changing anything (dry run).
      required: false
      default: false
      selector:
        boolean:

analyze_model_fit:
  name: Analyze model fit
  description: >
    Perform comprehensive analysis of model fit quality for all rooms.
    Computes goodness-of-fit metrics (RMSE, MAE, R²), residual statistics,
    and autocorrelation analysis from the accumulated history buffer.
    The per-room metrics are continuously exposed by the model-fit-quality
    sensors and also returned in the service response (visible in Developer
    Tools → Actions), helping identify when model parameters need adjustment.
  fields:
    room_name:
      name: Room name
      description: >
        Optional room name to analyze. If not specified, analyzes all rooms.
      required: false
      example: "living_room"
      selector:
        text:

validate_parameters:
  name: Validate thermal parameters
  description: >
    Validate the physical reasonableness of current thermal parameters
    (thermal_mass, r_external) for all rooms. Checks if parameters are
    within expected ranges and computes thermal time constants.
    Warns about potentially invalid or extreme parameter values that
    may indicate estimation problems or configuration errors.  The result is
    returned in the service response (visible in Developer Tools → Actions).
  fields:
    room_name:
      name: Room name
      description: >
        Optional room name to validate. If not specified, validates all rooms.
      required: false
      example: "living_room"
      selector:
        text:

controller_performance_report:
  name: Controller performance report
  description: >
    Generate a detailed report on MPC controller performance for setpoint
    tracking. Analyzes tracking errors, overshoot/undershoot, time spent
    above/below setpoint, and overall control quality. Helps identify
    whether controller tuning parameters (energy_weight, smoothing_weight,
    constraint_offset) need adjustment.  The report is returned in the service
    response (visible in Developer Tools → Actions).
  fields:
    room_name:
      name: Room name
      description: >
        Optional room name to analyze. If not specified, analyzes all rooms.
      required: false
      example: "living_room"
      selector:
        text:

set_schedule_enabled:
  name: Suspend or resume comfort schedule
  description: >
    Suspend or resume the comfort schedule (the time-of-day setback /
    sleep periods configured under each room's ``schedule`` block).
    Suspending a schedule restores the room's base setpoint and stops
    enforcing any "off" periods, which is useful for one-off exceptions
    such as staying up late or working from home.  When the room name is
    omitted the change applies to every configured room.  The schedule
    state is in-memory only and resets to enabled on restart.
  fields:
    room_name:
      name: Room name
      description: >
        Optional room name to target.  When omitted the change applies to
        every configured room.
      required: false
      example: "living_room"
      selector:
        text:
    enabled:
      name: Enabled
      description: >
        ``true`` resumes the schedule (default at startup), ``false``
        suspends it until re-enabled.
      required: true
      default: false
      selector:
        boolean:

run_open_loop_simulation:
  name: Run open-loop simulation diagnostic
  description: >
    Evaluate model quality by running a multi-step open-loop (free-run)
    simulation over the recorded history buffer and comparing it against the
    observed temperatures.  Unlike the one-step-ahead Kalman predictions that
    are reported by the PredictionErrorSensor, this test does not correct the
    model state at each step — errors therefore accumulate, exposing any
    systematic model drift.

    Results are exposed on the OpenLoopRMSESensor for each room.  Use this
    service after parameter estimation to verify that the updated model
    genuinely predicts temperature evolution rather than merely fitting a
    one-step-ahead filter.

    Rule of thumb: open-loop RMSE < 0.2 °C over 30 steps is excellent;
    > 0.5 °C indicates that the model should be re-estimated.
  fields:
    room_name:
      name: Room name
      description: >
        Optional room name to run the simulation for.  If not specified,
        simulates all rooms.
      required: false
      example: "living_room"
      selector:
        text:
    segment_length:
      name: Segment length (steps)
      description: >
        Number of history-buffer steps per open-loop simulation segment.
        Each step is one UPDATE_INTERVAL (default 900 s / 15 min), so the
        default of 30 steps corresponds to ~7.5 hours with default settings.
      required: false
      default: 30
      example: 30
      selector:
        number:
          min: 5
          max: 120
          step: 5
          unit_of_measurement: "steps"
    heater_scales:
      name: Heater power scales
      description: >
        Optional per-source heater power scales {source_name: scale} (1.0 =
        rated power) to preview in the simulation without applying them to the
        live model.  Falls back to the last auto-identified scales when omitted.
        Per-room thermal-model overrides may also be passed as
        ``<param>_<room_slug>`` keys (thermal_mass, r_external, internal_gain,
        solar_scale, c_air_fraction, r_aw_fraction).
      required: false
      example: '{"living_room_heater": 0.85}'
      selector:
        object:

compute_loglik_slice:
  name: Compute log-likelihood slice
  description: >
    Evaluate the CD-EKF PED log-likelihood on a 2-D grid in
    (log thermal_mass, log r_external) space, centred on the room's
    current MLE values.  Used by the Diagnostics dashboard to render a
    contour plot of the likelihood landscape so the user can assess
    parameter identifiability and the curvature of the optimum.  The
    computation runs CD-EKF over the full history buffer for every grid
    point and may take several seconds for an 11x11 grid.
  fields:
    room_name:
      name: Room name
      description: Room whose parameters should be sliced (must match a configured room).
      required: true
      example: "living_room"
      selector:
        text:
    n_grid:
      name: Grid points per axis
      description: Number of grid points per axis (odd values keep the centre on a grid line).
      required: false
      default: 11
      example: 11
      selector:
        number:
          min: 3
          max: 41
          step: 2
    span_log:
      name: Half-width (log-units)
      description: Half-width of the slice in log-units (1.0 ≈ factor 2.7 either side).
      required: false
      default: 1.0
      example: 1.0
      selector:
        number:
          min: 0.1
          max: 4.0
          step: 0.1

run_sysid_simulation:
  name: Run system identification (EKF reconstruction)
  description: >
    Reconstruct the state trajectory with a discrete-time Extended Kalman
    Filter (EKF) over a configurable history window.  At each step the
    one-step-ahead prediction x̂⁻(k) and its output uncertainty are recorded
    before incorporating the actual measurement, so the System Identification
    dashboard can overlay the EKF prediction (blue line) against the
    measurement (red line) with a ±2σ confidence band.  Unlike a free-run
    simulation the EKF residuals stay bounded, exposing model-plant mismatch
    without accumulated drift.  Results are stored on the per-room
    ``…_sysid_simulation`` sensor entities.
  fields:
    room_name:
      name: Room name
      description: >
        Optional room name.  If omitted, all rooms are simulated.
      required: false
      example: "living_room"
      selector:
        text:
    horizon_hours:
      name: Horizon (hours)
      description: >
        How many hours of history to simulate over (capped to the available
        buffer size).  Default is 6 hours.
      required: false
      default: 6.0
      example: 6.0
      selector:
        number:
          min: 0.5
          max: 72.0
          step: 0.5
          unit_of_measurement: "h"
    sigma_w:
      name: Process noise σ_w
      description: >
        Continuous-time process noise intensity [K/√s]  (Q_c = σ_w² · I).
        Controls how quickly the covariance band widens.  Matches the units
        used by the production CD-EKF controller.  Defaults to the
        controller's current σ_w.
      required: false
      example: 0.1
      selector:
        number:
          min: 0.0
          max: 10.0
          step: 0.01
          unit_of_measurement: "K/√s"
    sigma_v:
      name: Measurement noise σ_v
      description: >
        Standard deviation of the measurement noise [°C].  Added in quadrature
        to the state variance to produce the total confidence-band width.
        Defaults to the controller's current σ_v.
      required: false
      example: 0.5
      selector:
        number:
          min: 0.0
          max: 10.0
          step: 0.01
          unit_of_measurement: "°C"
    window_start:
      name: Window start (UNIX timestamp)
      description: >
        Optional explicit window start as a UNIX timestamp [s].  When both
        ``window_start`` and ``window_end`` are supplied, the reconstruction
        uses exactly the data in that range regardless of ``horizon_hours``.
        This lets you target a specific past experiment (e.g. an overnight
        step-response test) that is not the most recent data in the buffer.
        Use 0 or omit to fall back to the trailing horizon-based window.
      required: false
      example: 1700000000
      selector:
        number:
          min: 0
          step: 1
    window_end:
      name: Window end (UNIX timestamp)
      description: >
        Optional explicit window end as a UNIX timestamp [s].  Must be used
        together with ``window_start``.  See ``window_start`` for details.
      required: false
      example: 1700043200
      selector:
        number:
          min: 0
          step: 1
    heater_scales:
      name: Heater power scales
      description: >
        Optional per-source heater power scales {source_name: scale} (1.0 =
        rated power) to preview in the reconstruction without applying them to
        the live model.  Falls back to the last auto-identified scales when
        omitted.  Per-room thermal-model overrides may also be passed as
        ``<param>_<room_slug>`` keys (thermal_mass, r_external, internal_gain,
        solar_scale, c_air_fraction, r_aw_fraction).
      required: false
      example: '{"living_room_heater": 0.85}'
      selector:
        object:

regenerate_dashboard:
  name: Regenerate Lovelace dashboard
  description: >
    Rebuild a Heating Assistant Lovelace dashboard from the current room and
    heat-source configuration.  Choose ``classic`` (default) for the existing
    dashboard or ``industrial`` for the modern process-control dashboard with
    gauge-style KPIs and room-level process plots.  The generated YAML is
    returned in the service response and (unless ``dry_run`` is set) also
    written to ``<config>/dashboards``.
  fields:
    variant:
      name: Dashboard variant
      description: >
        Dashboard style to generate: ``classic`` (existing dashboard) or
        ``industrial`` (new process-control dashboard).
      required: false
      default: "classic"
      example: "industrial"
      selector:
        select:
          options:
            - "classic"
            - "industrial"
    dry_run:
      name: Dry run
      description: >
        When enabled, the YAML is returned in the response but no file is
        written.  Useful for previewing the dashboard before installing it.
      required: false
      default: false
      example: false
      selector:
        boolean:
    filename:
      name: Output filename
      description: >
        Optional plain filename (no directory components) for the generated
        YAML inside ``<config>/dashboards``.  Defaults to
        ``heating_assistant.yaml`` for ``classic`` and
        ``heating_assistant_industrial.yaml`` for ``industrial``.
      required: false
      example: "heating_assistant.yaml"
      selector:
        text:

update_controller_tuning:
  name: Update controller tuning
  description: >
    Update MPC controller parameters at runtime from the Heating Assistant
    dashboard. Changes take effect immediately and are persisted to the config
    entry.
  fields:
    tracking_weight:
      name: Tracking weight
      description: How strongly the controller chases the exact setpoint (0 = comfort band only).
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
    energy_weight:
      name: Energy weight
      description: How strongly the controller avoids running heaters.
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 0.01
    energy_price_weight:
      name: Price sensitivity
      description: How strongly the electricity price enters the MPC cost.
      required: false
      selector:
        number:
          min: 0
          max: 10000
          step: 0.1
    smoothing_weight:
      name: Output smoothing
      description: Penalises rapid changes in heater output.
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 0.05
    soft_constraint_weight:
      name: Comfort band quadratic penalty
      description: Quadratic penalty for staying outside the comfort band.
      required: false
      selector:
        number:
          min: 0
          max: 10000
          step: 1
    soft_constraint_linear_weight:
      name: Comfort band linear penalty
      description: Linear penalty for comfort-band violations. 0 = disabled.
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          step: 1
    terminal_weight:
      name: End-of-horizon weight
      description: Weight applied at the prediction horizon.
      required: false
      selector:
        number:
          min: 1
          max: 10000
          step: 1
    horizon:
      name: Prediction horizon
      description: Number of control intervals planned ahead.
      required: false
      selector:
        number:
          min: 1
          max: 480
          step: 1
    update_interval:
      name: Control interval
      description: Re-planning cadence in seconds.
      required: false
      selector:
        number:
          min: 60
          max: 3600
          step: 30
          unit_of_measurement: "s"
    comfort_offset:
      name: Comfort offset
      description: Symmetric comfort band half-width around setpoint.
      required: false
      selector:
        number:
          min: 0.1
          max: 5.0
          step: 0.1
          unit_of_measurement: "\u00b0C"

update_estimation_params:
  name: Update estimation parameters
  description: >
    Update state estimation and window detection parameters at runtime from the
    Heating Assistant dashboard. Changes take effect immediately and are
    persisted to the config entry.
  fields:
    sigma_w:
      name: Model adaptation rate
      description: Process noise intensity — how quickly the thermal model adapts.
      required: false
      selector:
        number:
          min: 0.000001
          max: 10
          step: 0.001
          unit_of_measurement: "K/\u221as"
    sigma_v:
      name: Sensor noise
      description: Expected indoor temperature sensor noise.
      required: false
      selector:
        number:
          min: 0.000001
          max: 10
          step: 0.001
          unit_of_measurement: "K"
    window_open_debounce:
      name: Window open debounce
      description: How long a window must stay open before responding.
      required: false
      selector:
        number:
          min: 0
          max: 3600
          step: 10
          unit_of_measurement: "s"
    window_open_close_settle:
      name: Window close settle
      description: How long a window must stay closed before resuming.
      required: false
      selector:
        number:
          min: 0
          max: 3600
          step: 10
          unit_of_measurement: "s"
    window_open_q_inflation:
      name: Open-state uncertainty multiplier
      description: How much the controller distrusts the model while a window is open.
      required: false
      selector:
        number:
          min: 1
          max: 1000
          step: 1

store_identified_parameters:
  name: Store identified parameters
  description: >
    Store and apply identified thermal parameters for a single room with full
    history tracking. The current active parameters are pushed to the history
    list (capped at 10 entries) and the new parameters become active. The live
    model and MPC controller are rebuilt immediately.
  fields:
    room_name:
      name: Room name
      description: Name of the room (must match a configured room name).
      required: true
      example: "living_room"
      selector:
        text:
    thermal_mass:
      name: Thermal mass
      description: Thermal mass of the room [J/K]. Must be at least 1000.
      required: true
      example: 5000000
      selector:
        number:
          min: 1000
          max: 100000000
          step: 1000
          unit_of_measurement: "J/K"
    r_external:
      name: External thermal resistance
      description: Thermal resistance to outdoor [K/W]. Must be at least 0.0001.
      required: true
      example: 0.04
      selector:
        number:
          min: 0.0001
          max: 10.0
          step: 0.0001
          unit_of_measurement: "K/W"
    source:
      name: Source
      description: >
        Origin of the parameter estimate: "ml" for machine-learning
        identification or "manual" for user-entered values.
      required: false
      default: "manual"
      selector:
        select:
          options:
            - "ml"
            - "manual"
    rmse:
      name: RMSE
      description: >
        Optional root-mean-square error from the identification run.
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 0.001
          unit_of_measurement: "K"
    internal_gain:
      name: Internal gain
      description: Identified constant internal heat gain for the room [W].
      required: false
      example: 150
      selector:
        number:
          min: -2000
          max: 5000
          step: 1
          unit_of_measurement: "W"
    solar_scale:
      name: Solar scale
      description: >
        Identified multiplier on the room's modelled solar gain (1.0 = model
        value).
      required: false
      example: 1.0
      selector:
        number:
          min: 0
          max: 10
          step: 0.01
    c_air_fraction:
      name: Air-node mass fraction
      description: >
        Share of the room's thermal mass attributed to the fast air node in
        the 2R2C envelope model (0–1).
      required: false
      example: 0.05
      selector:
        number:
          min: 0
          max: 1
          step: 0.001
    r_aw_fraction:
      name: Air-wall resistance fraction
      description: >
        Share of the conductive path attributed to the internal air↔wall film
        resistance in the 2R2C envelope model (0–1).
      required: false
      example: 0.05
      selector:
        number:
          min: 0
          max: 1
          step: 0.001
    heater_scales:
      name: Heater power scales
      description: >
        Identified per-source heater power scales as a mapping of source name
        to scale factor (1.0 = rated power), e.g. {"living_room_heater": 0.85}.
      required: false
      example: '{"living_room_heater": 0.85}'
      selector:
        object:

revert_parameters:
  name: Revert parameters
  description: >
    Revert thermal parameters for a room to a previous entry from the
    parameter history. The current active parameters are pushed to history
    and the selected history entry becomes the new active set. The live model
    and MPC controller are rebuilt immediately.
  fields:
    room_name:
      name: Room name
      description: Name of the room (must match a configured room name).
      required: true
      example: "living_room"
      selector:
        text:
    history_index:
      name: History index
      description: >
        Zero-based index into the parameter history list (0 = most recent
        previous entry, up to 9).
      required: true
      default: 0
      selector:
        number:
          min: 0
          max: 9
          step: 1

update_room_schedule:
  name: Update room schedule
  description: >
    Replace the comfort schedule for a single room. The new periods list is
    persisted to the config entry and the coordinator's in-memory schedule is
    rebuilt immediately.
  fields:
    room_name:
      name: Room name
      description: Name of the room (must match a configured room name).
      required: true
      example: "living_room"
      selector:
        text:
    periods:
      name: Schedule periods
      description: >
        List of schedule period objects. Each period must include name, mode
        ("comfort" or "off"), start (HH:MM), and end (HH:MM). Optional fields
        are days (list of weekday integers 0-6 or names), setpoint (float),
        frost_protection (float, default 12.0), comfort_offset (float, band
        half-width override), tracking_weight (float, setpoint tracking
        multiplier), and energy_weight (float, energy penalty multiplier).
      required: true
      example:
        - name: "Morning"
          mode: "comfort"
          start: "06:00"
          end: "08:30"
          setpoint: 21.0
          comfort_offset: 1.5
          days: [0, 1, 2, 3, 4]
        - name: "Night"
          mode: "off"
          start: "22:00"
          end: "06:00"
          frost_protection: 12.0

set_room_comfort_offset:
  name: Set room comfort offset
  description: >
    Set the default comfort-band half-width (symmetric ±offset around the
    setpoint) for a single room. Called from the dashboard climate cards so the
    comfort corridor can be widened or narrowed without editing a schedule. The
    change is applied to the live model immediately and persisted to the config
    entry. A schedule period with its own comfort_offset still overrides this
    default while that period is active.
  fields:
    room_name:
      name: Room name
      description: Name or slug of the room (must match a configured room).
      required: true
      example: "living_room"
      selector:
        text:
    comfort_offset:
      name: Comfort offset
      description: Symmetric comfort-band half-width around the setpoint.
      required: true
      example: 2.0
      selector:
        number:
          min: 0.1
          max: 5.0
          step: 0.1
          unit_of_measurement: "°C"
