<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Heating Assistant Industrial Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="static/css/industrial.css">
  <style>
    body {
      margin: 0;
      background: #1a1d23;
      color: #e8eaed;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #ingress-status {
      display: none;
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 10;
      max-width: min(480px, calc(100vw - 24px));
      border: 1px solid rgba(0, 212, 170, 0.6);
      border-radius: 999px;
      background: rgba(26, 29, 35, 0.92);
      color: #00d4aa;
      padding: 6px 12px;
      font-size: 12px;
      line-height: 1.4;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    #ingress-status[data-status="error"] {
      border-color: rgba(229, 115, 115, 0.8);
      color: #e57373;
    }
    ha-industrial-panel {
      display: block;
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="panel-root"></div>
  <div id="ingress-status">Loading App API...</div>

  <script src="static/js/app-hass-shim.js"></script>
  <script src="ha-industrial-panel/industrial-dashboard.js?v=129"></script>
  <script>
    (async () => {
      const status = document.getElementById('ingress-status');
      try {
        const ingressBase = window.__HA_INGRESS_BASE;
        if (
          !ingressBase
          && !window.location.pathname.startsWith('/ha-industrial')
        ) {
          window.history.replaceState(
            window.history.state,
            '',
            `/ha-industrial${window.location.search}${window.location.hash || '#overview'}`,
          );
        }
        await customElements.whenDefined('ha-industrial-panel');
        const shim = await new window.HeatingAssistantAppHassShim({
          statusElement: status,
        }).start();
        window.hass = shim;

        const panel = document.createElement('ha-industrial-panel');
        panel.hass = shim;
        panel.narrow = window.innerWidth < 870;
        document.getElementById('panel-root').appendChild(panel);
      } catch (err) {
        status.textContent = `Panel boot failed: ${err?.message || err}`;
        status.dataset.status = 'error';
        console.error('[HeatingAssistant App] industrial panel boot failed:', err);
      }
    })();
  </script>
</body>
</html>
