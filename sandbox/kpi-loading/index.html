<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sandbox: compute timer loading overlay</title>
  <style>
    html, body {
      margin: 0;
      background: #111318;
      color: #e8eaed;
      font-family: system-ui, sans-serif;
    }
    .page {
      padding: 20px 24px 32px;
      max-width: 1180px;
    }
    h1 { font-size: 16px; font-weight: 600; margin: 0 0 8px; }
    .lead { color: #9aa0a8; font-size: 13px; margin: 0 0 20px; max-width: 78ch; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .panel-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6b7280;
      margin: 0 0 8px;
    }
    ha-kpi-host { display: block; min-height: 220px; }
    @media (max-width: 800px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="page">
    <h1>Compute timer loading overlay</h1>
    <p class="lead" id="lead">
      Overview CONTROLLER KPIS: live values (HEATING POWER, ENERGY PRICE) plus
      NEXT CONTROL and NEXT NMPC rings. Left is shipped (KPI shimmer, timers
      idle). Right is the candidate (timers load per flag; KPIs stay live).
    </p>
    <div class="row">
      <section>
        <div class="panel-label">Current (shipped)</div>
        <ha-kpi-host id="current"></ha-kpi-host>
      </section>
      <section>
        <div class="panel-label">Candidate (sandbox)</div>
        <ha-kpi-host id="candidate" data-candidate="1"></ha-kpi-host>
      </section>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
