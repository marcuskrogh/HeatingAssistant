[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "heatingassistant"
version = "2026.08.24"
description = "HeatingAssistant App runtime for Home Assistant OS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.21.0",
  "scipy>=1.9.0",
  "highspy",
  "paho-mqtt>=1.6",
  "mbc@https://github.com/marcuskrogh/mbc/archive/5b0a7098d403d35eac0d97092ef21437573ab94f.zip",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=1.6"]

[tool.setuptools.packages.find]
include = ["heatingassistant*"]

# Ingress UI assets must ship in the wheel; without this, Docker `pip install .`
# omits heatingassistant/app/static and HA side-panel Ingress returns 404.
[tool.setuptools.package-data]
"heatingassistant.app" = ["static/**/*"]
