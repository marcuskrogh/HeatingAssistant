[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "heatingassistant"
version = "2.0.0"
description = "HeatingAssistant App runtime for Home Assistant OS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mqtt = ["paho-mqtt>=1.6"]

[tool.setuptools.packages.find]
include = ["heatingassistant*"]
