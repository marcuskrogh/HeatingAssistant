name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y nodejs

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "mbc @ git+https://github.com/marcuskrogh/mbc.git"

      - name: Run unit and integration tests
        run: python -m pytest tests/ -v -m "not slow" --cov=custom_components/heating_assistant --cov-report=term-missing

      - name: Run panel harness smoke tests
        run: |
          for harness in tests/panel_*.harness.mjs; do
            echo "Running $harness"
            node "$harness"
          done
