<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Heating Assistant UI scale preview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; background: #111; }
    ha-scale-preview { display: block; min-height: 100vh; }
  </style>
</head>
<body>
  <ha-scale-preview></ha-scale-preview>
  <script>
    class HaScalePreview extends HTMLElement {
      constructor() {
        super();
        const root = this.attachShadow({ mode: 'open' });
        const css = (href) => {
          const l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = href;
          return l;
        };
        root.appendChild(css('/heatingassistant/app/static/css/industrial.css'));
        root.appendChild(css('/heatingassistant/app/static/css/pages/identification.css'));
        root.appendChild(css('/heatingassistant/app/static/css/pages/tuning.css'));
        const wrap = document.createElement('div');
        wrap.className = 'shell';
        wrap.innerHTML = `
          <nav class="panel-nav panel-nav--live">
            <div class="panel-nav__brand">
              <span class="panel-nav__name">HEATING ASSISTANT</span>
            </div>
            <div class="panel-nav__links panel-nav__links--open">
              <a class="panel-nav__link panel-nav__link--active" href="#">OVERVIEW</a>
              <a class="panel-nav__link" href="#">SCHEDULES</a>
              <a class="panel-nav__link" href="#">TUNING</a>
              <a class="panel-nav__link" href="#">PARAMETER ESTIMATION</a>
              <a class="panel-nav__link" href="#">SYSTEM STATUS</a>
              <a class="panel-nav__link" href="#">CONFIGURATION</a>
            </div>
          </nav>
          <div class="content">
            <div class="section-header">SYSTEM STATUS</div>
            <div class="grid-kpi" style="margin-bottom:24px">
              <div class="card kpi">
                <div class="kpi__value">21.4</div>
                <div class="kpi__label">Comfort</div>
              </div>
              <div class="card gauge">
                <div class="gauge__label">Tracking error</div>
                <div class="gauge__value">0.31 °C</div>
              </div>
            </div>
            <h2 class="room-header__title">Living room</h2>
            <div class="tuning-section__title">Controller Preview</div>
            <div class="chart-container card">
              <div class="chart-container__title">Temperature</div>
              <div class="chart-container__canvas" style="height:var(--chart-height-primary);display:flex;align-items:flex-end;padding:8px 12px">
                <svg viewBox="0 0 320 80" width="100%" height="100%" preserveAspectRatio="none">
                  <line x1="0" y1="40" x2="320" y2="40" stroke="#6b7280" stroke-dasharray="4 4"/>
                  <polyline fill="none" stroke="#4fc3f7" stroke-width="2"
                    points="0,50 40,46 80,30 120,28 160,36 200,22 240,26 280,18 320,20"/>
                </svg>
              </div>
            </div>
            <div class="pe-progress" style="margin-top:24px;position:relative">
              <div class="pe-progress__clock">
                <div class="pe-progress__remaining">29:36</div>
                <div class="pe-progress__clock-label">Time remaining</div>
                <div class="pe-progress__clock-cap">of 30:00 maximum</div>
              </div>
              <div class="pe-progress__head">
                <div class="pe-progress__kicker">Parameter estimation</div>
                <p class="pe-progress__title">Getting a starting guess</p>
              </div>
              <div class="pe-progress__metrics">
                <div>
                  <div class="pe-progress__metric-label">Fit error</div>
                  <div class="pe-progress__metric-value">0.53</div>
                </div>
                <div>
                  <div class="pe-progress__metric-label">Evaluations</div>
                  <div class="pe-progress__metric-value">34</div>
                </div>
              </div>
              <div class="pe-progress__plot-wrap">
                <div class="pe-progress__plot-label">Fit error (toward zero)</div>
                <canvas class="pe-progress__plot" width="680" height="200"></canvas>
              </div>
              <div class="pe-progress__legend">
                <span><i class="pe-progress__swatch pe-progress__swatch--j"></i>Fit error</span>
                <span><i class="pe-progress__swatch pe-progress__swatch--tol"></i>Target (zero)</span>
              </div>
            </div>
          </div>
        `;
        root.appendChild(wrap);
        const canvas = root.querySelector('.pe-progress__plot');
        const ctx = canvas.getContext('2d');
        const cs = getComputedStyle(canvas);
        ctx.fillStyle = cs.getPropertyValue('--bg-primary').trim() || '#1a1d23';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = cs.getPropertyValue('--chart-temp').trim() || '#4fc3f7';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(40, 40);
        ctx.lineTo(200, 90);
        ctx.lineTo(640, 150);
        ctx.stroke();
        ctx.fillStyle = cs.getPropertyValue('--text-dim').trim() || '#6b7280';
        ctx.font = '11px system-ui, sans-serif';
        ctx.fillText('evaluation', 300, 190);
      }
    }
    customElements.define('ha-scale-preview', HaScalePreview);
  </script>
</body>
</html>
